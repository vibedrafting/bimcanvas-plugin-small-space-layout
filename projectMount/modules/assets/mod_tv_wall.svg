<svg viewBox="0 0 1240 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .fine-lines { fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- 外框 -->
  <rect x="4" y="4" width="1232" height="72" class="main-lines" />
  <!-- 屏幕内框 -->
  <rect x="20" y="12" width="1200" height="56" rx="4" class="detail-lines" />
  <!-- 屏幕中心十字参考线 -->
  <line x1="620" y1="12" x2="620" y2="68" class="fine-lines" />
  <line x1="20" y1="40" x2="1220" y2="40" class="fine-lines" />
  <text x="620" y="46" font-size="28" text-anchor="middle" fill="#000">电视</text>
</svg>
