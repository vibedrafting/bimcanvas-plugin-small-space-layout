<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
      .fine-lines { fill: none; stroke: #000000; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- 外框 -->
  <rect x="10" y="10" width="580" height="580" class="main-lines" />
  <!-- 滚筒门圈（圆形） -->
  <circle cx="300" cy="320" r="200" class="detail-lines" />
  <!-- 内圈 -->
  <circle cx="300" cy="320" r="140" class="fine-lines" />
  <!-- 控制面板线 -->
  <line x1="10" y1="100" x2="590" y2="100" class="detail-lines" />
  <!-- 控制旋钮指示 -->
  <circle cx="120" cy="55" r="28" class="fine-lines" />
  <circle cx="480" cy="55" r="28" class="fine-lines" />
  <text x="300" y="340" font-size="90" text-anchor="middle" fill="#000">洗</text>
</svg>
