<svg viewBox="0 0 450 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .fine-lines { fill: none; stroke: #000000; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- 椅面轮廓（略圆角） -->
  <rect x="10" y="10" width="430" height="480" rx="40" class="main-lines" />
  <!-- 椅面内框 -->
  <rect x="40" y="40" width="370" height="420" rx="28" class="detail-lines" />
  <!-- 中心十字 -->
  <line x1="225" y1="40" x2="225" y2="460" class="fine-lines" />
  <line x1="40" y1="250" x2="410" y2="250" class="fine-lines" />
  <text x="225" y="270" font-size="90" text-anchor="middle" fill="#000">椅</text>
</svg>
